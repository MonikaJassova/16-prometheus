apiVersion: v1
kind: Pod
metadata:
  name: crash-test
  labels:
    app: crash-test
spec:
  restartPolicy: Always
  containers:
  - name: crash-test
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    livenessProbe:
      exec: { command: ["false"] }
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 1

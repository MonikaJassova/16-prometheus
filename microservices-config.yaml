---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice # to match Service with Deployment
spec:
  selector:
    matchLabels:
      app: emailservice # to match Pod with Deployment
  template:
    metadata:
      labels:
        app: emailservice # to match Pod with Deployment
    spec:
      containers:
      - name: service
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice:v0.10.6
        ports:
        - containerPort: 8080 # where app listens on
        env:
        - name: PORT
          value: "8080"
        livenessProbe:
          grpc:
            port: 8080
          periodSeconds: 5
        readinessProbe:
          grpc:
            port: 8080
          periodSeconds: 5
        resources:
          requests: 
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
spec:
  type: ClusterIP
  selector:
    app: emailservice # to match Service with Deployment
  ports:
  - protocol: TCP
    port: 5000 # service port
    targetPort: 8080 # for app, same as containerPort

